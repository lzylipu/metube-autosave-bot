name: metube-autosave-bot

services:
  bot:
    image: lzylipu/metubebot:latest
    container_name: metubebot
    environment:
      PORT: 8080
      SUPERUSER: "${SUPERUSER}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      METUBE_ENDPOINT: "${METUBE_ENDPOINT:-http://metube:8081}"
      SIMPLE_COMMAND: "${SIMPLE_COMMAND:-1}"
      PROGRESS_ENABLED: "${PROGRESS_ENABLED:-true}"
      PROGRESS_INTERVAL_SECONDS: "${PROGRESS_INTERVAL_SECONDS:-5}"
      PROGRESS_TIMEOUT_SECONDS: "${PROGRESS_TIMEOUT_SECONDS:-1800}"
    restart: unless-stopped
    network_mode: host
